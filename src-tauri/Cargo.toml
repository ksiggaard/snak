[package]
name = "snak"
version = "0.1.0"
description = "Multi-provider LLM chat app for KDE"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "snak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
# Native "Save as…" dialog for downloading shared images to disk (T44).
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# In-app auto-updater: checks the GitHub release `latest.json`, then downloads
# and installs a newer signed build. `process` provides `relaunch()` to restart
# the app once the update is applied.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP client for provider APIs. rustls avoids a system TLS dependency on the
# KDE/Linux target; `stream` is used for SSE streaming in Stage 4.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
anyhow = "1"
# Official MCP SDK — used as a client for external stdio MCP servers, giving us
# a correct initialize/initialized handshake and a persistent, id-correlating
# session per server (replaces the old spawn-per-call stdio path). T-stateful-mcp.
rmcp = { version = "1.7", features = ["client", "transport-child-process"] }
futures-util = "0.3"
base64 = "0.22"
# Async process + IO for the MCP stdio transport (T13). Tauri already pulls tokio
# into the tree; we depend on it directly for `process` + `io-util`.
tokio = { version = "1", features = ["process", "io-util", "macros", "rt", "sync", "time"] }
# Document text extraction (T39): pure-Rust PDF text, zip + streaming XML for
# the OOXML/ODF container formats, calamine for spreadsheets. zip only needs
# deflate (no bzip2/aes baggage).
pdf-extract = "0.10"
quick-xml = "0.40"
calamine = "0.35"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# Local date/time + timezone for the built-in `device` tool server. Both are
# already in the tree transitively; `chrono`'s `clock` gives `Local::now()` and
# the offset, `iana-time-zone` gives the IANA timezone name.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
iana-time-zone = "0.1"
# OS desktop notifications (chat-done alert). Used directly rather than
# tauri-plugin-notification because the official plugin can't detect desktop
# notification clicks (mobile-only); notify-rust's wait_for_action can, which is
# what powers click-to-open-thread on the KDE target.
notify-rust = "4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# OS keychain for API keys. Backend is selected per-platform: macOS Keychain,
# Windows Credential Manager, and the Secret Service (KWallet/GNOME) on Linux.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
# Grant microphone access to the WebKitGTK webview (the in-webview recorder used
# by the audio plugin's STT). Pinned to the version wry already resolves so the
# `WebView` type from `with_webview().inner()` matches (no duplicate crate).
webkit2gtk = "=2.0.2"

# Use a local patched tray-icon that passes the file stem (not the full path)
# as the SNI IconName. KDE Plasma's StatusNotifier host requires a freedesktop
# icon name (no slashes) so it can resolve the icon relative to IconThemePath.
# Upstream bug: set_icon_full is called with the absolute path, which KDE ignores.
[patch.crates-io]
tray-icon = { path = "vendor/tray-icon" }

