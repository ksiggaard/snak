[package]
name = "snak"
version = "0.1.0"
description = "Multi-provider LLM chat app for KDE"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "snak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP client for provider APIs. rustls avoids a system TLS dependency on the
# KDE/Linux target; `stream` is used for SSE streaming in Stage 4.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
anyhow = "1"
futures-util = "0.3"
base64 = "0.22"
# Async process + IO for the MCP stdio transport (T13). Tauri already pulls tokio
# into the tree; we depend on it directly for `process` + `io-util`.
tokio = { version = "1", features = ["process", "io-util", "macros", "rt"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# OS keychain for API keys. Backend is selected per-platform: macOS Keychain,
# Windows Credential Manager, and the Secret Service (KWallet/GNOME) on Linux.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# Use a local patched tray-icon that passes the file stem (not the full path)
# as the SNI IconName. KDE Plasma's StatusNotifier host requires a freedesktop
# icon name (no slashes) so it can resolve the icon relative to IconThemePath.
# Upstream bug: set_icon_full is called with the absolute path, which KDE ignores.
[patch.crates-io]
tray-icon = { path = "vendor/tray-icon" }

